<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story de Leituras</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ================= RESET ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ================= BASE (APENAS COFFEE) ================= */
:root {
    --bg: #2b1d16;
    --text: #f5e6d3;
    --accent: #c69c6d;
    --border: #5a3e2b;
    --font-title: 'Inter', sans-serif;
}

body {
    font-family: 'Inter', sans-serif;
    background: #121212; /* Fundo externo escuro */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}

/* ================= CONTROLES ================= */
.controls {
    background: #3d2b1f;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

select, button {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    outline: none;
}

button:hover {
    background: var(--accent);
    color: #2b1d16;
}


/* STORY CANVAS (Visual Original Restaurado) */
#story-canvas {
    width: 360px;
    height: 640px;
    background: linear-gradient(180deg, #2b1d16, #1a120d);
    color: var(--text);
    padding: 25px;
    display: flex;
    flex-direction: column;
    border: 4px solid var(--border);
}

/* HEADER ORIGINAL */
.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-family: var(--font-title);
    font-size: 28px;
}

.header span {
    color: var(--accent);
    font-size: 14px;
}

/* GRID ORIGINAL (4 colunas) */
.books-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.book {
    position: relative;
}

.book img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
}

.badge {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    backdrop-filter: blur(4px);
    background: rgba(0,0,0,0.6);
    color: #ffd700;
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 12px;
}

.badge .fav {
    font-size: 10px;
    opacity: 0.9;
    color: rgb(202, 1, 102);
}

/* FOOTER ORIGINAL */
.stats {
    margin-top: auto;
    text-align: center;
    border-top: 1px solid var(--accent);
    padding-top: 10px;
}

/* BOTÕES */
button, select {
    margin: 3px;
    padding: 6px;
}
</style>
</head>

<body>

<div class="controls">
    <select id="selectYear" onchange="updateStory()"></select>
    <select id="selectMonth" onchange="updateStory()"></select>
    <button onclick="updateStory()">Atualizar</button>
    <button onclick="downloadImage()">Salvar</button>
    <button onclick="downloadYear()">Salvar Ano</button>
</div>

<div id="story-canvas">
    <div class="header">
        <h1 id="displayMonth"></h1>
        <span id="displayYear"></span>
    </div>

    <div id="booksGrid" class="books-grid"></div>

    <div id="statsArea" class="stats"></div>
</div>

<script>
let allBooks = [];
let currentFiltered = [];
const monthsNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

async function init() {
    const res = await fetch('books.json');
    allBooks = await res.json();

    // Pega os anos e ordena (mais recente primeiro)
    const years = [...new Set(allBooks.map(b => b.YEAR))].sort((a, b) => b - a);
    
    years.forEach(y => selectYear.innerHTML += `<option value="${y}">${y}</option>`);
    monthsNames.forEach(m => selectMonth.innerHTML += `<option value="${m}">${m}</option>`);

    // Abre no item mais recente do JSON
    if (allBooks.length > 0) {
        const lastEntry = allBooks[allBooks.length - 1];
        selectYear.value = lastEntry.YEAR;
        selectMonth.value = lastEntry.MONTH;
    }

    updateStory();
}

function getStars(rating) {
    const full = Math.floor(rating);
    const half = rating % 1 !== 0;
    let stars = '★'.repeat(full);
    if (half) stars += '☆';
    return stars;
}

function updateStory() {
    const year = parseInt(selectYear.value);
    const month = selectMonth.value;

    displayMonth.innerText = month;
    displayYear.innerText = year;

    currentFiltered = allBooks.filter(b => b.YEAR === year && b.MONTH === month);

    // Mantém a renderização original (mostrando os primeiros 12 no story padrão)
    renderBooks(currentFiltered.slice(0, 12));
}

function getMonthStats() {
    let total = 0;
    currentFiltered.forEach(b => total += b.PAGES);
    return total;
}

function renderBooks(list) {
    booksGrid.innerHTML = '';

    list.forEach(book => {
        booksGrid.innerHTML += `
        <div class="book">
            <img src="${book.CAPA}" crossorigin="anonymous">
            <div class="badge">
                <span>${getStars(book.RATING)}</span>
                ${book.FAV === 'YES' ? '<span class="fav">❤︎</span>' : ''}
            </div>
        </div>`;
    });

    statsArea.innerHTML = `
        <b>${currentFiltered.length}</b> livros • 
        <b>${getMonthStats()}</b> páginas
    `;
}

async function downloadImage() {
    const chunkSize = 12;
    for (let i = 0; i < currentFiltered.length; i += chunkSize) {
        renderBooks(currentFiltered.slice(i, i + chunkSize));
        await new Promise(r => setTimeout(r, 200));

        const canvas = await html2canvas(document.getElementById('story-canvas'), {
            useCORS: true,
            scale: 3
        });

        const link = document.createElement('a');
        link.download = `story_${selectMonth.value}_${i/chunkSize + 1}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
    updateStory(); // Volta ao normal
}

async function downloadYear() {
    const year = parseInt(selectYear.value);
    for (let m of monthsNames) {
        const hasBooks = allBooks.some(b => b.YEAR === year && b.MONTH === m);
        if(!hasBooks) continue;

        selectMonth.value = m;
        updateStory();
        await new Promise(r => setTimeout(r, 300));

        const canvas = await html2canvas(document.getElementById('story-canvas'), {
            useCORS: true,
            scale: 3
        });

        const link = document.createElement('a');
        link.download = `story_${year}_${m}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
    updateStory();
}

init();
</script>

</body>
</html>
